services:
  water:
    image: ligson/water:${WATER_IMAGE_TAG:-latest}
    container_name: water
    restart: unless-stopped
    init: true
    user: "${WATER_UID:-1026}:${WATER_GID:-100}"
    working_dir: /workspace
    environment:
      HOME: /data/home
      TZ: ${TZ:-Asia/Shanghai}
      WATER_HTTP_ADDR: ":8080"
      WATER_DATA_DIR: /data
      WATER_DATABASE_PATH: /data/water.db
      WATER_ACCESS_PIN: ${WATER_ACCESS_PIN:?set WATER_ACCESS_PIN in the remote .env file}
      WATER_DOCUMENT_ENGINE: ${WATER_DOCUMENT_ENGINE:-native}
    volumes:
      - ./data:/data
      - ${WATER_WORKSPACE_HOST_PATH:?set WATER_WORKSPACE_HOST_PATH in the remote .env file}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WATER_WEB_BIND_ADDRESS:-127.0.0.1}:${WATER_WEB_PORT:-13013}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
