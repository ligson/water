name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: water-be/go.mod
          cache-dependency-path: water-be/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: water-fe/package-lock.json

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi

      - name: Extract release notes
        run: ./scripts/extract-release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Test backend
        working-directory: water-be
        run: |
          go test ./...
          go vet ./...

      - name: Build release packages
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-${{ github.ref_name }}
          path: output/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(output/release/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "若水 $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "若水 $GITHUB_REF_NAME"
          fi
