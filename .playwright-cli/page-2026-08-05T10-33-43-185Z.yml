          - paragraph [ref=e128]: "请先确认操作系统类型（Linux/Windows/macOS）。 ### 1. Linux (服务器/内网首选) ```bash free -h ``` - **风险**：部分详细命令（如 `ps aux`）扫描所有进程可能增加短暂 I/O 负载。 - **验证**：先执行 `free -h` 确认输出正常后再查看详细进程。 - **权限**：需 `sudo` 或 root 权限才能查看所有用户进程。 ### 2. Windows (桌面/终端) - **GUI**：任务管理器 → 性能 → 内存。 - **CLI**：PowerShell `Get-Counter '\\Memory\\Available MBytes'`。 - **风险**：高频率计数器请求可能轻微影响系统响应。 - **验证**：在低峰期运行，观察 `Get-Counter` 延迟。 ### ⚠️ 安全建议 - 生产环境请确认为空闲时间段。 - 避免长时间运行全量进程排序命令 (`ps aux --sort=-%mem`)，防止内存快照过大。 需要针对特定进程或容器（Docker/K8s）分析吗？"
