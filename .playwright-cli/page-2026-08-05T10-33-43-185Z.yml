          - paragraph [ref=e138]: "收到。作为运行在内网的 Water，我无法直接读取你的本地硬件数据，但你可以通过以下低风险命令自行验证： 1. **Windows** * 命令：`systeminfo | findstr /C:\"物理内存\"` * 风险：**无**（只读查询）。 2. **macOS** * 命令：`sysctl hw.memsize | xcodebuild -dump` (建议用 `system_profiler SPHardwareDataType | grep \"Memory\"`) * 建议命令：`memory_sync | grep \"Memory Total\"` (注：更通用的终端命令为 `top` 观察或使用 `sysctl`) * 推荐命令：`sysctl hw.memsize` * 风险：**无**。 3. **Linux** * 命令：`free -h | grep Mem` * 风险：**无**。 **注意事项：** 请在命令行终端仅输入上述官方命令，不要粘贴来源不明的脚本。"
