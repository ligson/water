          - paragraph [ref=e98]: "我无法直接读取你的本地文件系统，但可以提供安全的命令行查询方式。请在对应的终端中执行： ### 1. Windows (PowerShell / CMD) ```powershell wmic logicaldisk get size,freespace,caption # 或者 PowerShell 更推荐： Get-Volume -DriveLetter C | Select-Object SizeRemaining, Size ``` * **风险**：普通 CMD 命令可能无权限，建议以**管理员身份运行**。 * **验证**：输出 `Size` 单位为**字节 (Bytes)**，请除以 `1024` 换算 GB。 ### 2. macOS / Linux ```bash df -h / ``` * **风险**：低风险，仅影响当前会话查看。 * **验证**：`Size` 列显示总容量，`Avail` 列显示可用空间，通常显示为 GB/KM 单位。 **建议**：优先使用系统自带命令 (`wmic`, `df`)，避免加载未经验证的脚本以防信息泄露。"
